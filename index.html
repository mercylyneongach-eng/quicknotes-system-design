
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickNotes API client and system design project">
    <title>QuickNotes - System Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>QuickNotes</h1>
        <p>Your simple online notes manager</p>
    </header>

    <main class="container">
        <section class="panel">
            <h2>My Notes</h2>
            <p>Load example notes from the server or create your own.</p>

            <button id="load-btn" type="button">Load notes</button>

            <p id="status" role="status" aria-live="polite">
                Click "Load notes" to get started.
            </p>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note title</label>
                    <input
                        id="title-input"
                        name="title"
                        type="text"
                        maxlength="100"
                        placeholder="Enter a note title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="body-input">Note body (optional)</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="4"
                        placeholder="Write your note here..."
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">Create note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Notes from the server</h2>
            <ul id="notes-list" aria-live="polite"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes System Design Project</p>
    </footer>
</body>
</html>
